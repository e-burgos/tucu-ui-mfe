name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    outputs:
      authentication: ${{ steps.build.outputs.authentication }}
      landing: ${{ steps.build.outputs.landing }}
      user-profile: ${{ steps.build.outputs.user-profile }}
      dashboard: ${{ steps.build.outputs.dashboard }}
      dev-server: ${{ steps.build.outputs.dev-server }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Verify pnpm-lock.yaml exists
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "✓ pnpm-lock.yaml found"
            ls -lh pnpm-lock.yaml
          else
            echo "⚠ pnpm-lock.yaml not found in repository"
            echo "Current directory contents:"
            ls -la
          fi

      - name: Install dependencies
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Installing with frozen-lockfile..."
            pnpm install --frozen-lockfile
          else
            echo "Warning: pnpm-lock.yaml not found, installing without frozen-lockfile"
            pnpm install
          fi

      - name: Build all apps
        id: build
        env:
          # GitHub Pages deployment configuration
          # Base domain: https://e-burgos.github.io/tucu-ui-mfe/
          # All apps deploy under this base path, NOT directly at https://e-burgos.github.io/
          # Example: landing app deploys to https://e-burgos.github.io/tucu-ui-mfe/landing/
          VITE_APP_ENVIRONMENT: production
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.example.com/api' }}
          # VITE_BASE_PATH sets the repository subdirectory path for all apps
          # This ensures apps are served from /tucu-ui-mfe/app-name/ not /app-name/
          VITE_BASE_PATH: /${{ github.event.repository.name }}
          # APP_URLS - Full URLs for each app (must include https:// protocol)
          VITE_APP_AUTHENTICATION_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/authentication
          VITE_APP_LANDING_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/landing
          VITE_APP_USER_PROFILE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/user-profile
          VITE_APP_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard
          VITE_APP_DEV_SERVER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # APP_PATHS - Paths relative to base domain (used for routing)
          # These include the repository name for GitHub Pages deployment
          VITE_APP_AUTHENTICATION_PATH: /${{ github.event.repository.name }}/authentication
          VITE_APP_LANDING_PATH: /${{ github.event.repository.name }}/landing
          VITE_APP_USER_PROFILE_PATH: /${{ github.event.repository.name }}/user-profile
          VITE_APP_DASHBOARD_PATH: /${{ github.event.repository.name }}/dashboard
          # DEV_SERVER path is just the repository name (no app name)
          VITE_APP_DEV_SERVER_PATH: /${{ github.event.repository.name }}
        run: |
          pnpm build
          echo "authentication=dist/apps/authentication" >> $GITHUB_OUTPUT
          echo "landing=dist/apps/landing" >> $GITHUB_OUTPUT
          echo "user-profile=dist/apps/user-profile" >> $GITHUB_OUTPUT
          echo "dashboard=dist/apps/dashboard" >> $GITHUB_OUTPUT
          echo "dev-server=dist/apps/dev-server" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          # Upload the entire dist/apps directory to preserve structure
          path: dist/apps
          retention-days: 7

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts structure..."
          echo "Contents of dist/:"
          ls -la dist/ || echo "dist/ directory not found"
          echo ""
          echo "When artifacts are downloaded, the structure is flattened:"
          echo "dist/apps/authentication -> dist/authentication"
          echo "So we need to check for dist/authentication, not dist/apps/authentication"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment structure
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # GitHub Pages deployment structure
          # Base domain: https://e-burgos.github.io/tucu-ui-mfe/
          # All apps are deployed under the repository subdirectory
          # Structure: _site/app-name/ (not _site/ directly at root)
          # This ensures apps are accessible at: https://e-burgos.github.io/tucu-ui-mfe/app-name/
          mkdir -p _site

          # Note: When artifacts are downloaded, GitHub Actions flattens the structure
          # If we upload dist/apps, it downloads as dist/authentication, dist/landing, etc.
          # So we copy from dist/ directly, not from dist/apps/

          # Verify artifacts exist before copying
          if [ ! -d "dist/authentication" ]; then
            echo "Error: dist/authentication not found"
            echo "Contents of dist/:"
            ls -la dist/ || true
            exit 1
          fi

          # Copy each app to its respective path under _site/
          # These will be served from: https://e-burgos.github.io/tucu-ui-mfe/app-name/
          cp -r dist/authentication _site/authentication
          cp -r dist/landing _site/landing
          cp -r dist/user-profile _site/user-profile
          cp -r dist/dashboard _site/dashboard
          cp -r dist/dev-server _site/dev-server

          # Create .nojekyll to disable Jekyll processing (required for SPA routing)
          touch _site/.nojekyll

          # Create root index.html that redirects to landing
          # This handles requests to: https://e-burgos.github.io/tucu-ui-mfe/
          # Redirects to: https://e-burgos.github.io/tucu-ui-mfe/landing/
          cat > _site/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tucu UI - Micro Frontends</title>
            <meta http-equiv="refresh" content="0; url=/${REPO_NAME}/landing/">
            <link rel="canonical" href="/${REPO_NAME}/landing/">
          </head>
          <body>
            <p>Redirecting to <a href="/${REPO_NAME}/landing/">landing page</a>...</p>
          </body>
          </html>
          EOF

          # Create 404.html for SPA routing (GitHub Pages fallback)
          # This ensures that direct navigation to routes works
          cat > _site/404.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>404 - Page Not Found</title>
            <script>
              // GitHub Pages SPA routing fallback
              // Extract the path and redirect to the appropriate app
              const path = window.location.pathname;
              const repoName = '${REPO_NAME}';
              const basePath = '/' + repoName;
              
              // Remove the base path to get the app path
              let appPath = path;
              if (path.startsWith(basePath)) {
                appPath = path.substring(basePath.length);
              }
              
              // Ensure appPath starts with /
              if (!appPath.startsWith('/')) {
                appPath = '/' + appPath;
              }
              
              // Redirect to the appropriate app based on path
              if (appPath.startsWith('/authentication') || appPath.includes('/authentication/')) {
                window.location.href = basePath + '/authentication/';
              } else if (appPath.startsWith('/landing') || appPath.includes('/landing/')) {
                window.location.href = basePath + '/landing/';
              } else if (appPath.startsWith('/user-profile') || appPath.includes('/user-profile/')) {
                window.location.href = basePath + '/user-profile/';
              } else if (appPath.startsWith('/dashboard') || appPath.includes('/dashboard/')) {
                window.location.href = basePath + '/dashboard/';
              } else if (appPath.startsWith('/dev-server') || appPath.includes('/dev-server/')) {
                window.location.href = basePath + '/dev-server/';
              } else {
                window.location.href = basePath + '/landing/';
              }
            </script>
          </head>
          <body>
            <p>Redirecting...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
