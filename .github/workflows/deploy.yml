name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    outputs:
      authentication: ${{ steps.build.outputs.authentication }}
      landing: ${{ steps.build.outputs.landing }}
      user-profile: ${{ steps.build.outputs.user-profile }}
      dashboard: ${{ steps.build.outputs.dashboard }}
      dev-server: ${{ steps.build.outputs.dev-server }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Verify pnpm-lock.yaml exists
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "✓ pnpm-lock.yaml found"
            ls -lh pnpm-lock.yaml
          else
            echo "⚠ pnpm-lock.yaml not found in repository"
            echo "Current directory contents:"
            ls -la
          fi

      - name: Install dependencies
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Installing with frozen-lockfile..."
            pnpm install --frozen-lockfile
          else
            echo "Warning: pnpm-lock.yaml not found, installing without frozen-lockfile"
            pnpm install
          fi

      - name: Build all apps
        id: build
        env:
          VITE_APP_ENVIRONMENT: production
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.example.com/api' }}
          VITE_APP_AUTHENTICATION_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/authentication
          VITE_APP_LANDING_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/landing
          VITE_APP_USER_PROFILE_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/user-profile
          VITE_APP_DASHBOARD_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard
        run: |
          pnpm build
          echo "authentication=dist/apps/authentication" >> $GITHUB_OUTPUT
          echo "landing=dist/apps/landing" >> $GITHUB_OUTPUT
          echo "user-profile=dist/apps/user-profile" >> $GITHUB_OUTPUT
          echo "dashboard=dist/apps/dashboard" >> $GITHUB_OUTPUT
          echo "dev-server=dist/tools/dev-server" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/apps/authentication
            dist/apps/landing
            dist/apps/user-profile
            dist/apps/dashboard
            dist/tools/dev-server
          retention-days: 7

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment structure
        run: |
          mkdir -p _site

          # Copy each app to its respective path
          cp -r dist/apps/authentication _site/authentication
          cp -r dist/apps/landing _site/landing
          cp -r dist/apps/user-profile _site/user-profile
          cp -r dist/apps/dashboard _site/dashboard

          # Create index.html that redirects to landing
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tucu UI - Micro Frontends</title>
            <meta http-equiv="refresh" content="0; url=/landing/">
            <link rel="canonical" href="/landing/">
          </head>
          <body>
            <p>Redirecting to <a href="/landing/">landing page</a>...</p>
          </body>
          </html>
          EOF

          # Create 404.html for SPA routing (GitHub Pages fallback)
          # This ensures that direct navigation to routes works
          cat > _site/404.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>404 - Page Not Found</title>
            <script>
              // GitHub Pages SPA routing fallback
              // Redirect to the appropriate app based on path
              const path = window.location.pathname;
              const repoName = path.split('/')[1] || '';
              
              if (path.includes('/authentication')) {
                window.location.href = '/authentication/';
              } else if (path.includes('/landing')) {
                window.location.href = '/landing/';
              } else if (path.includes('/user-profile')) {
                window.location.href = '/user-profile/';
              } else if (path.includes('/dashboard')) {
                window.location.href = '/dashboard/';
              } else {
                window.location.href = '/landing/';
              }
            </script>
          </head>
          <body>
            <p>Redirecting...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
